services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arc
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/arc
      SIGNAL_WEBHOOK_SECRET: dev-signal-secret
      TOOLS_API_TOKEN: dev-tools-token
      SEED_DEMO: "true"
      # ARC_LLM_API_KEY: set this to use a real model instead of the offline classifier
    ports: ["8080:8080"]
